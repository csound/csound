<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <title>WASI realtime live API checks</title>
  <script type="module">
    const gated = new URLSearchParams(location.search).has("probe");
    const { default: Csound } = await import(gated ? "/probe/csound.js" : "/dist/csound.js");
    const checks = [];
    const check = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const until = async (predicate, message) => {
      const deadline = performance.now() + 10000;
      while (!(await predicate())) {
        if (performance.now() >= deadline) throw new Error(message);
        await delay(20);
      }
    };
    const rejects = async (action, message) => {
      try {
        await action();
      } catch (error) {
        return error;
      }
      throw new Error(message);
    };
    const source = `
sr = 48000
ksmps = 32
nchnls = 1
0dbfs = 1
chn_k "gain", 3
chnset 0.125, "gain"
chn_k "registry-ticks", 3
chn_k "registry-errors", 3
${Array.from({ length: 16 }, (_, index) => `chn_k "registry-render-${index}", 3`).join("\n")}
instr 79
  kcount init 0
  kerrors init 0
  kcount += 1
  Sname sprintfk "registry-render-%d", kcount % 16
  chnset kcount, Sname
  kvalue chnget Sname
  if kvalue != kcount then
    kerrors += 1
  endif
  chnset kcount, "registry-ticks"
  chnset kerrors, "registry-errors"
endin
instr 1
  kgain chnget "gain"
  asignal oscils 1, 440, 0
  out asignal * kgain
endin
`;
    let csound;
    let probe;
    let analyser;
    let silence;
    const messages = [];
    let phase = "live APIs";
    const releaseGate = () => {
      if (probe) {
        Atomics.store(probe, 1, 1);
        Atomics.notify(probe, 1);
      }
    };
    try {
      check(crossOriginIsolated, "live API test requires isolation headers");
      csound = await Csound({ useWorker: true, autoConnect: false });
      csound.on("message", (message) => messages.push(message));
      await csound.setOption("-odac -m0 --daemon --realtime");
      // Background workers cannot open the parent's files, even if preloaded.
      await csound.fs.writeFile(
        "live-include.orc",
        new TextEncoder().encode("giIncluded init 1\n"),
      );
      // A second compile before start would replace the header's global init.
      check(
        (await csound.compileOrc(`
${source}
opcode SignatureInput(value:i):i
  xout value + 1
endop
opcode SignatureInput():i
  xout 77
endop
opcode SignatureOutput(value:i):i
  xout value + 2
endop
opcode SignatureOutput(value:i):void
endop
instr SignatureChecks
  iInput SignatureInput 41
  iOutput SignatureOutput 40
  chnset iInput, "signature-input"
  chnset iOutput, "signature-output"
  chnset SignatureInput(), "signature-empty"
endin
`)) === 0,
        "overload lookup trapped or failed on an empty input or output signature",
      );
      checks.push("fixed-memory overload lookup skips empty signatures");
      check((await csound.start()) === 0, "start failed");
      const initialGain = await csound.getControlChannel("gain");
      check(initialGain === 0.125, `initial gain was not initialized: ${initialGain}`);
      check(
        (await csound.evalCode('schedule "SignatureChecks", 0, 0.01\nreturn 0')) === 0,
        "could not schedule overload assertions",
      );
      check(
        (await csound.evalCode("return SignatureInput(41)")) === 42,
        "functional overload lookup chose the empty signature",
      );
      const context = await csound.getAudioContext();
      await context.resume();
      analyser = context.createAnalyser();
      analyser.fftSize = 2048;
      silence = context.createGain();
      silence.gain.value = 0;
      (await csound.getNode()).connect(analyser);
      analyser.connect(silence);
      silence.connect(context.destination);
      const samples = new Float32Array(analyser.fftSize);
      const audible = () => {
        analyser.getFloatTimeDomainData(samples);
        return (
          Math.sqrt(samples.reduce((sum, value) => sum + value * value, 0) / samples.length) > 0.02
        );
      };
      await csound.event(0, [1, 0, -1]);
      await until(audible, "steady voice did not reach the AudioWorklet");
      check(
        (await csound.getControlChannel("signature-input")) === 42 &&
          (await csound.getControlChannel("signature-output")) === 42 &&
          (await csound.getControlChannel("signature-empty")) === 77,
        "overload lookup returned the wrong values",
      );

      if (gated) {
        phase = "channel allocation lock scope";
        check(
          (await csound.evalCode("return test_wasi_browser_channel_allocs()")) === 0,
          "channel creation, listing, or hints allocated while holding the registry lock",
        );
        checks.push("channel growth, listing, and hint copies allocate outside the registry lock");
      }

      // Submit without awaiting between calls: completion must preserve writes
      // and keep each evaluation's result attached to its own request.
      const ordered = await Promise.all([
        csound.setStringChannel("source", "abcdefg"),
        csound.evalCode('return strlen(chnget:S("source"))'),
        csound.evalCode("return 29"),
        csound.getStringChannel("source"),
      ]);
      check(
        ordered[1] === 7 && ordered[2] === 29 && ordered[3] === "abcdefg",
        "live API order or evaluation results were mixed: " + JSON.stringify(ordered),
      );
      const text = "λ音".repeat(4096);
      await csound.setStringChannel("source", text);
      check(
        (await csound.getStringChannel("source")) === text,
        "resized UTF-8 string did not round-trip",
      );
      checks.push(
        "ordered string writes, per-request evaluation results, and resized UTF-8 strings",
      );

      const renderText = "λ音".repeat(4096);
      check(
        (await csound.compileOrc(`
chn_S "render-string", 3
instr 81
  Slarge init "${renderText}"
  ktime timeinsts
  if int(ktime * 20) % 2 == 0 then
    chnset "short", "render-string"
  else
    chnset Slarge, "render-string"
  endif
endin
`)) === 0,
        "string writer setup failed",
      );
      await csound.event(0, [81, 0, -1]);
      await until(
        async () => (await csound.getStringChannel("render-string")) !== "",
        "perf-time string writer did not start",
      );
      const stringLengths = new Set();
      for (let read = 0; read < 32; read++) {
        const value = await csound.getStringChannel("render-string");
        check(value === "short" || value === renderText, "string read mixed concurrent writes");
        stringLengths.add(value.length);
        await delay(10);
      }
      check(stringLengths.size === 2, "string writer did not exercise both sizes");
      await csound.event(0, [-81, 0, 0]);
      checks.push("string snapshots stay intact while a perf-time writer changes their size");

      check(
        (await csound.compileOrc(`
chn_k "live-gain", 3
chn_k "last-note", 3
instr 77
  chnset p4, "last-note"
endin
`)) === 0,
        "live instrument/channel compilation failed",
      );
      await csound.setControlChannel("live-gain", 0.625);
      check(
        (await csound.getControlChannel("live-gain")) === 0.625,
        "new channel was inaccessible",
      );
      await csound.event(0, [77, 0, 0.05, 23]);
      await until(
        async () => (await csound.getControlChannel("last-note")) === 23,
        "new instrument was not ready when compilation resolved",
      );
      checks.push("compile completion publishes new instruments and numeric channels");

      // Dynamic render names force registry lookups on every control period.
      // Global init creates 640 other entries, crossing several hash resizes.
      await csound.event(0, [79, 0, -1]);
      await until(
        async () => (await csound.getControlChannel("registry-ticks")) > 16,
        "dynamic channel instrument did not start",
      );
      const registryClock = Number(await csound.getCurrentTimeSamples());
      const registryTicks = await csound.getControlChannel("registry-ticks");
      for (let batch = 0; batch < 8; batch++) {
        check(
          (await csound.compileOrc(`
iRegistry = ${batch * 40}
while iRegistry < ${(batch + 1) * 40} do
  SRegistryNumber sprintf "registry-number-%d", iRegistry
  SRegistryString sprintf "registry-string-%d", iRegistry
  chnset iRegistry + 1, SRegistryNumber
  chnset "created", SRegistryString
  iRegistry += 1
od
`)) === 0,
          "channel registry growth failed",
        );
        check(
          (await csound.getControlChannel(`registry-number-${batch * 40}`)) === batch * 40 + 1,
          "registry resize lost a numeric channel",
        );
        check(
          (await csound.getStringChannel(`registry-string-${batch * 40}`)) === "created",
          "registry resize lost a string channel",
        );
        await delay(20);
        check(audible(), "audio stopped while channel registry grew");
      }
      check(
        (await csound.getControlChannel("registry-errors")) === 0,
        "dynamic channel lookup returned the wrong value during registry growth",
      );
      check(
        (await csound.getControlChannel("registry-ticks")) > registryTicks + 16,
        "dynamic channel instrument stopped during registry growth",
      );
      const alternating = await Promise.all([
        csound.getControlChannel("registry-render-0"),
        csound.getControlChannel("registry-render-15"),
      ]);
      check(
        alternating.every((value) => value > 0) && alternating[0] !== alternating[1],
        "render did not use changing channel names",
      );
      check(
        Number(await csound.getCurrentTimeSamples()) > registryClock + context.sampleRate / 10,
        "sample clock stopped during registry growth",
      );
      checks.push(
        "dynamic render channel names stay correct while live code grows numeric and string registries",
      );

      for (const invalid of [
        "instr 78\nsyntax nonsense @@@\nendin",
        "#ifdef MISSING_ENDIF\n",
        '#include "live-include.orc"\n',
      ]) {
        const result = await csound.compileOrc(invalid);
        check(
          result !== 0,
          "invalid or file-dependent live compile succeeded: " +
            JSON.stringify({ invalid, result }),
        );
        check(
          (await csound.compileOrc("instr 78\nendin")) === 0,
          "valid compile failed after a compiler error: " + messages.join("\n"),
        );
        check(
          (await csound.evalCode("return 41")) === 41,
          "evaluation failed after compiler recovery",
        );
      }
      checks.push("syntax, preprocessor, and unsupported file errors recover without restart");
      check(
        (await csound.compileOrc(`
chn_k "kept-result", 3
instr KeepOnError
  chnset 71, "kept-result"
endin
`)) === 0,
        "named instrument setup failed",
      );
      check(
        (await csound.compileOrc(`
instr KeepOnError
  chnset 99, "kept-result"
endin
instr 98
  Sarr[] fillarray "x", "y"
  kidx init 0
  prints Sarr[kidx]
endin
`)) !== 0,
        "invalid replacement compiled",
      );
      check(
        (await csound.evalCode("schedule KeepOnError, 0, 0.01\nreturn 0")) === 0,
        "could not schedule the original named instrument after rejection",
      );
      await until(
        async () => (await csound.getControlChannel("kept-result")) === 71,
        "failed compilation changed the existing named instrument",
      );
      checks.push("rejected compilation preserves the existing named instrument");
      phase = "scheduling through instrument replacement";
      const target = `
instr LoopTarget
  iSeen chnget "loop-seen"
  chnset iSeen + 1, "loop-seen"
endin
`;
      check(
        (await csound.compileOrc(`
chn_k "loop-sent", 3
chn_k "loop-seen", 3
${target}
instr 80
  saved:InstrDef = LoopTarget
  kSent init 0
  kTick metro 100
  if kTick == 1 && kSent < 120 then
    kSent += 1
    if kSent % 5 == 0 then
      schedulek LoopTarget, 0, 0.001
    elseif kSent % 5 == 1 then
      schedulek saved, 0, 0.001
    elseif kSent % 5 == 2 then
      event "i", "LoopTarget", 0, 0.001
    elseif kSent % 5 == 3 then
      schedulek "LoopTarget", 0, 0.001
    else
      schedkwhen 1, 0, 1000, "LoopTarget", 0, 0.001
    endif
    chnset kSent, "loop-sent"
  endif
endin
`)) === 0,
        "live scheduler setup failed",
      );
      await csound.event(0, [80, 0, 10]);
      await until(
        async () => (await csound.getControlChannel("loop-seen")) > 0,
        "live scheduler did not start",
      );
      for (let edit = 0; edit < 24; edit++) {
        const reject = edit % 2 === 0;
        // Add enough distinct names to rehash the compiler's mutable table
        // while event/schedulek/schedkwhen keep looking up a string name.
        const addedNames = Array.from(
          { length: 16 },
          (_, index) => `instr LiveName${edit}_${index}\nendin\n`,
        ).join("");
        const result = await csound.compileOrc(
          target + addedNames +
            (reject
              ? `
instr 98
  Sarr[] fillarray "x", "y"
  kidx init 0
  prints Sarr[kidx]
endin
`
              : ""),
        );
        check(reject ? result !== 0 : result === 0, "unexpected replacement result");
        await delay(10);
        check(audible(), "steady audio stopped during instrument replacement");
      }
      await until(
        async () => (await csound.getControlChannel("loop-sent")) === 120,
        "scheduler stopped during live edits",
      );
      await until(
        async () => (await csound.getControlChannel("loop-seen")) === 120,
        "live edits lost scheduled notes through references or string names",
      );
      checks.push(
        "references and string names keep every note through replacement and name-table growth",
      );
      for (const action of [
        () => csound.compileOrc("return 0\0return 1"),
        () => csound.evalCode("return 0\0return 1"),
        () => csound.setStringChannel("source", "bad\0text"),
        () => csound.setStringChannel("bad\0name", "text"),
        () => csound.compileOrc(" ".repeat(1048577)),
      ])
        await rejects(action, "invalid live API input was accepted");
      check((await csound.evalCode("return 43")) === 43, "input rejection broke later calls");
      checks.push("invalid strings and oversized requests reject without breaking the worker");

      if (gated) {
        probe = csound["__threadProbe"];
        check(probe instanceof Int32Array, "missing private evaluation gate");
        const measureHeap = async (expression) => {
          // The probe temporarily fills the heap. Stop audio allocations while
          // measuring, but keep rendering during the compiler recovery checks.
          // Queue the call before pausing, since paused engines reject new calls.
          for (let index = 0; index < 4; index++) Atomics.store(probe, index, 0);
          const measured = csound.evalCode("test_wasi_browser_hold\nreturn " + expression);
          measured.catch(() => {});
          try {
            await until(() => Atomics.load(probe, 0) === 1, "heap evaluation did not reach its gate");
            check((await csound.pause()) === 0, "could not pause for heap measurement");
            releaseGate();
            return await measured;
          } finally {
            releaseGate();
            await measured.catch(() => {});
            for (let index = 0; index < 4; index++) Atomics.store(probe, index, 0);
            check((await csound.resume()) === 0, "could not resume after heap measurement");
          }
        };
        const freeHeap = () => measureHeap("test_wasi_browser_heap_free()");
        const macroArguments = () => csound.evalCode("return test_wasi_browser_macro_args()");
        phase = "fragmented heap measurement";
        const recovered = await measureHeap("test_wasi_browser_heap_fragment()");
        check(
          Math.abs(recovered - 8 * 1024 * 1024) < 65536,
          "heap probe did not count a freed block between live allocations: " + recovered,
        );
        phase = "small fragmented heap measurement";
        const smallRecovered = await measureHeap("test_wasi_browser_heap_small_fragments()");
        check(
          Math.abs(smallRecovered - 128 * 1024) < 16384,
          "heap probe did not count freed KiB blocks: " + smallRecovered,
        );
        phase = "successful macro evaluation";
        check(
          (await csound.evalCode("#define ECHO(value) #return $value#\n$ECHO(31)")) === 31,
          "parameterized macro evaluation failed",
        );
        phase = "macro argument count";
        check((await macroArguments()) === 0, "successful expansion retained macro arguments");
        phase = "parameterized macro definition";
        check(
          (await csound.compileOrc("#define BROKEN(value) #$value#")) === 0,
          "parameterized macro definition failed",
        );
        const incomplete = [
          "#ifdef MISSING_ENDIF\n",
          "#else\n",
          "#define UNFINISHED #body",
          "#define UNFINISHED_ARG(value) #body",
          "#define NESTED #$NESTED#\n$NESTED\n",
          "$BROKEN(#ifdef MISSING_ENDIF\n)\n",
        ];
        // A long comment still makes flex copy almost 1 MiB of source. Every
        // failure must free both that raw buffer and Csound's expanded text.
        const paddedFailure = (text) => ";" + "x".repeat(1000000) + "\n" + text;
        for (const text of incomplete) {
          phase = "preprocessor recovery: " + text;
          check(
            (await csound.compileOrc(paddedFailure(text))) !== 0,
            "incomplete preprocessing succeeded",
          );
        }
        phase = "free heap before repeated failures";
        const freeBefore = await freeHeap();
        check(freeBefore > 128 * 1024 * 1024, "allocator cannot use the shared memory capacity");
        for (let round = 0; round < 3; round++) {
          for (const text of incomplete) {
            phase = "repeated preprocessor recovery: " + text;
            check(
              (await csound.compileOrc(paddedFailure(text))) !== 0,
              "repeated preprocessing succeeded",
            );
          }
        }
        phase = "macro argument count after failures";
        check((await macroArguments()) === 0, "failed expansion retained macro arguments");
        phase = "free heap after repeated failures";
        const freeAfter = await freeHeap();
        check(
          freeBefore - freeAfter < 65536,
          `recovered preprocessing retained heap: before=${freeBefore}, after=${freeAfter}`,
        );
        checks.push(
          "repeated incomplete preprocessing frees scanners, buffers, and partial macros",
        );
        // These faults occur after preprocessing: verification jumps out for
        // invalid array targets and typed p-fields; compilation rejects a
        // performance-only string read used at init time. Local definitions
        // ensure each attempt owns a substantial tree and variable pool.
        const locals = Array.from({ length: 128 }, (_, index) => `iHeap${index} init 1`).join("\n");
        const failedEdits = [
          ["syntax", "syntax nonsense @@@"],
          ["typed p-field", "p1:i = 1"],
          ["missing array", "kMissing[0] = 1"],
          ["missing argument", 'printf "%d", 1, kMissing'],
          [
            "UDO argument type",
            "endin\nopcode HeapFailure(karg:MissingType):i\nxout 1\nendop\ninstr 95",
          ],
          ["unfinished string", "Sbad = {{" + "x".repeat(100000)],
          ["if before failure", "if iHeap0 > 0 then\niHeap1 = 2\nendif\np1:i = 1"],
          ["while before failure", "while iHeap0 < 2 do\niHeap0 += 1\nod\np1:i = 1"],
          [
            "earlier instruments",
            `endin\ninstr 96\n${locals}\nendin\ninstr 97\n${locals}\np1:i = 1`,
          ],
          ["string array phase", 'Sarr[] fillarray "x", "y"\nkidx init 0\nprints Sarr[kidx]'],
        ];
        const compilerHeap = [];
        for (const [name, fault] of failedEdits) {
          const edit = `instr 98\n${locals}\n${fault}\nendin`;
          phase = "warm compiler failure: " + name;
          check((await csound.compileOrc(edit)) !== 0, "invalid edit compiled: " + name);
          const before = await freeHeap();
          // Compilation rejection follows a successful parse. More repeats
          // catch small allocations that survive that ownership handoff.
          const attempts = name === "string array phase" ? 80 : 8;
          for (let attempt = 0; attempt < attempts; attempt++) {
            phase = "repeat compiler failure: " + name;
            check((await csound.compileOrc(edit)) !== 0, "invalid edit compiled: " + name);
          }
          const after = await freeHeap();
          compilerHeap.push({ name, before, after });
          check(
            (await csound.compileOrc("instr 98\nendin")) === 0 &&
              (await csound.evalCode("return 67")) === 67,
            "valid edit failed after recovery: " + name,
          );
        }
        check(
          compilerHeap.every(({ before, after }) => before - after < 65536),
          "failed edits retained compiler heap: " + JSON.stringify(compilerHeap),
        );
        checks.push(
          "repeated parsing, verification, and compilation failures release temporary state",
        );
        phase = "published opcode reference after rejected edit";
        check(
          (await csound.compileOrc(`
  opcode KeptLookup(iValue:i):i
    xout iValue
  endop
  instr 98
    p1:i = 1
  endin
  `)) !== 0,
          "invalid edit after an opcode definition compiled",
        );
        check(
          (await csound.evalCode("return test_wasi_browser_freed_lookup()")) === 0,
          "parser cleanup freed a published opcode lookup",
        );
        check(
          (await csound.evalCode("opcodeinfo KeptLookup\nreturn 71")) === 71,
          "recovery freed a published opcode lookup",
        );
        check(
          (await csound.compileOrc(`
  opcode KeptLookup(iValue:i):i
    xout iValue + 1
  endop
  `)) === 0 && (await csound.evalCode("return KeptLookup(71)")) === 72,
          "opcode definition could not be compiled and called after rejection",
        );
        checks.push("published opcode lookups survive a later semantic error");
        phase = "held evaluation and stop";
        probe = csound["__threadProbe"];
        check(probe instanceof Int32Array, "missing private evaluation gate");
        let evaluationDone = false;
        const evaluation = csound.evalCode("test_wasi_browser_hold\nreturn 47").then((result) => {
          evaluationDone = true;
          return result;
        });
        // Observe rejection from the start, including if a worker fails below.
        const evaluationResult = Promise.allSettled([evaluation]);
        await until(() => Atomics.load(probe, 0) === 1, "evaluation did not enter its gate");
        check(Atomics.load(probe, 3) === 1, "evaluation did not run on a Csound pthread");
        const before = Number(await csound.getCurrentTimeSamples());
        // A valid background call can outlive the old ten-second host timeout.
        // Keep it held while checking that render and scalar calls still run.
        for (let sample = 0; sample < 22; sample++) {
          await delay(500);
          check(audible(), "steady audio stopped while evaluation waited");
          check(
            (await csound.getSr()) === context.sampleRate,
            "scalar query blocked during evaluation",
          );
        }
        check(
          Number(await csound.getCurrentTimeSamples()) - before > context.sampleRate / 10,
          "sample clock stopped while evaluation waited",
        );
        check(!evaluationDone, "evaluation completed before gate release");
        await csound.setControlChannel("gain", 0.1);
        check(
          (await csound.getControlChannel("gain")) === Math.fround(0.1),
          "existing numeric channel blocked behind evaluation",
        );
        checks.push(
          "evaluation survives ten seconds while audio, the clock, and cached channels progress",
        );

        const pending = Promise.allSettled([
          csound.setStringChannel("cancelled", "stale"),
          csound.evalCode("return 53"),
          csound.getStringChannel("source"),
        ]);
        await rejects(
          () => csound.evalCode("return 59"),
          "full live API queue accepted another request",
        );
        let resetDone = false;
        const reset = csound
          .stop()
          .then(() => csound.reset())
          .then(() => {
            resetDone = true;
          });
        const resetResult = Promise.allSettled([reset]);
        await delay(150);
        check(!resetDone, "reset freed state before the running evaluation finished");
        releaseGate();
        const running = (await evaluationResult)[0];
        check(
          running.status === "fulfilled" && running.value === 47,
          "running evaluation lost its result during stop",
        );
        check(
          (await pending).every((result) => result.status === "rejected"),
          "stop replayed queued API work",
        );
        const ended = (await resetResult)[0];
        if (ended.status === "rejected") throw ended.reason;
        check(Atomics.load(probe, 2) === 1, "reset completed before the evaluation left its gate");
        checks.push(
          "bounded live API queue rejects overflow; stop cancels queued work and joins running work",
        );
      } else {
        await csound.stop();
        await csound.reset();
      }
      await csound.setOption("-odac -m0 --daemon --realtime");
      check((await csound.compileOrc(source)) === 0, "compile after reset failed");
      check((await csound.start()) === 0, "restart failed");
      await (await csound.getAudioContext()).resume();
      await csound.setStringChannel("cancelled", "fresh");
      check(
        (await csound.getStringChannel("cancelled")) === "fresh",
        "old request changed new performance",
      );
      check((await csound.evalCode("return 61")) === 61, "live API failed after restart");
      await csound.stop();
      await csound.reset();
      await csound.terminateInstance();
      csound = undefined;
      checks.push("reset and restart accept new work without replaying old requests");
      window.__csoundRealtimeResult = { ok: true, checks };
    } catch (error) {
      releaseGate();
      if (csound) await csound.terminateInstance().catch(() => {});
      window.__csoundRealtimeResult = {
        ok: false,
        checks,
        error:
          phase +
          ": " +
          String(error) +
          "\n" +
          (error.stack || "") +
          "\n" +
          messages.slice(-30).join("\n"),
      };
    } finally {
      analyser?.disconnect();
      silence?.disconnect();
    }
  </script>
</html>
