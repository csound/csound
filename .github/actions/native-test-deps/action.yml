name: Install native test dependencies
description: Install the same libraries for a native build and its test runners.
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang cmake ninja-build ccache python3 libgtest-dev \
          libsndfile1-dev libasound2-dev libjack-dev portaudio19-dev \
          libportmidi-dev libpulse-dev swig liblua5.1-0-dev default-jdk \
          liblo-dev libsamplerate0-dev libpipewire-0.3-dev bison flex gettext

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install libogg flac lame libvorbis mpg123 opus libsndfile portaudio libsamplerate liblo portmidi
        brew install bison flex jack ninja ccache
