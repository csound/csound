name: 'Check PR Label on Merge Commit'
description: 'Checks if the merged PR associated with the current commit has a specific label.'
inputs:
  label:
    description: 'Label to check for (e.g., release)'
    required: true
  github_token:
    description: 'GitHub token'
    required: true
outputs:
  has_label:
    description: 'true if label exists, false otherwise'
    value: ${{ steps.check_label.outputs.has_label }}
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gh jq

    - name: Find PR and check label
      id: check_label
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        LABEL_TO_CHECK: ${{ inputs.label }}
      run: |
        set -uo pipefail

        PR_NUMBER=""

        # Primary lookup: the commits -> pulls endpoint also resolves rebase
        # merges, where the mergeCommit field of a PR is null.
        if [ -n "${GITHUB_REPOSITORY:-}" ] && [ -n "${GITHUB_SHA:-}" ]; then
          PR_NUMBER="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select((.merged_at // "") != "") | .number] | sort | last // empty' 2>/dev/null | tr -d '[:space:]' || true)"
        fi

        # Fallback: match on the merge commit recorded in the PR.
        if [ -z "${PR_NUMBER:-}" ] || ! [[ "${PR_NUMBER:-}" =~ ^[0-9]+$ ]]; then
          PR_NUMBER="$(gh pr list --state merged --limit 100 --json number,mergeCommit -q ".[] | select((.mergeCommit // null) != null and .mergeCommit.oid == \"${GITHUB_SHA}\") | .number" 2>/dev/null | tail -n 1 | tr -d '[:space:]' || true)"
        fi

        if [ -z "${PR_NUMBER:-}" ] || ! [[ "${PR_NUMBER:-}" =~ ^[0-9]+$ ]]; then
          echo "No PR found for commit $GITHUB_SHA"
          echo "has_label=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if ! LABELS="$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' 2>/dev/null)"; then
          echo "Failed to fetch labels for PR #$PR_NUMBER"
          echo "has_label=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "${LABELS:-}" ]; then
          echo "Label $LABEL_TO_CHECK not found for commit $GITHUB_SHA (PR #$PR_NUMBER)"
          echo "has_label=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if grep -qiw -- "$LABEL_TO_CHECK" <<< "$LABELS"; then
          echo "Label $LABEL_TO_CHECK found for commit $GITHUB_SHA (PR #$PR_NUMBER)"
          echo "has_label=true" >> "$GITHUB_OUTPUT"
        else
          echo "Label $LABEL_TO_CHECK not found for commit $GITHUB_SHA (PR #$PR_NUMBER)"
          echo "has_label=false" >> "$GITHUB_OUTPUT"
        fi
