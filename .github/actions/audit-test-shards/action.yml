name: Check the full native test results
description: Fail if any test group or test result is missing or repeated.
inputs:
  name:
    description: Artifact name suffix.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8.0.1
      with:
        name: native-plan-${{ inputs.name }}
        path: .ci-test-plans
    - uses: actions/download-artifact@v8.0.1
      with:
        pattern: native-results-${{ inputs.name }}-*
        path: .ci-test-results
    - shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
      run: |
        python3 .github/scripts/ci-test-shards.py audit \
          --plan ".ci-test-plans/$ARTIFACT_NAME.json" --results .ci-test-results
