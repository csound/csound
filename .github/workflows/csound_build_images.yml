name: docker_builds

on:
#  pull_request:
#    branches:
#      - develop
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build-and-push-android-image:
    name: Android
    runs-on: ubuntu-latest
    env:
      VERSION: v1
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          docker-images: false

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: platform/android
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/csound-android:${{ env.VERSION }},ghcr.io/${{ github.repository_owner }}/csound-android:latest

  build-and-push-ioscross-image:
    name: ioscross
    runs-on: ubuntu-latest
    env:
      VERSION: v1
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          docker-images: false

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: platform/ioscross
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/csound-ioscross:${{ env.VERSION }},ghcr.io/${{ github.repository_owner }}/csound-ioscross:latest
          build-args: |
            DOWNLOAD_URL=${{ vars.IOSCROSS_DOWNLOAD_URL }}
          secrets: |
            IOSCROSS_PASSWORD=${{ secrets.IOSCROSS_PASSWORD }}

  build-and-push-osxcross-image:
    name: osxcross
    runs-on: ubuntu-latest
    env:
      VERSION: v1
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          docker-images: false

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: platform/osxcross
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/csound-osxcross:${{ env.VERSION }},ghcr.io/${{ github.repository_owner }}/csound-osxcross:latest
