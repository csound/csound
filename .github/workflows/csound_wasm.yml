name: csound_wasm
run-name: "WASM | ${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || format('{0} push', github.ref_name) }}"

env:
  nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/d3b13ad75cc492690728f9307e443dec9ef9a20e.tar.gz

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  csound-wasm:
    env:
      wasm_bin_dir: ./platform/wasm-wasi
    name: Compiling wasm bins
    runs-on: ubuntu-latest
    outputs:
      realtime-supported: ${{ steps.realtime.outputs.supported }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: ${{ env.nix_path }}
      - uses: cachix/cachix-action@v17
        with:
          name: csound
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Compile Csound and accessory wasm binaries
        run: cd $wasm_bin_dir && yarn build
      - name: Run WASI pthread checks and build private browser fixtures
        id: realtime
        run: |
          bash "$wasm_bin_dir/scripts/compile-test-fixtures.sh"
          echo "supported=$(cat "$wasm_bin_dir/test-artifacts/realtime-supported")" >> "$GITHUB_OUTPUT"
      - name: Archive private realtime fixtures
        if: steps.realtime.outputs.supported == '1'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wasm-realtime-test-fixtures
          path: ${{ env.wasm_bin_dir }}/test-artifacts
      - name: Zip the compilation output
        run: |
          cd $wasm_bin_dir
          nix-env -f '<nixpkgs>' -iA zip
          zip -r lib.zip lib
      - name: Archive Wasm Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lib
          path: ${{ env.wasm_bin_dir }}/lib.zip
      - name: Archive command-line test sources
        continue-on-error: false
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wasm-commandline-test-sources
          path: |
            ./platform/wasm-wasi/src/csound-tests.nix
            ./tests/commandline

  commandline-tests:
    needs: csound-wasm
    name: CSD tests with Wasmtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download threaded WASI command from build job
        if: needs.csound-wasm.outputs.realtime-supported == '1'
        uses: actions/download-artifact@v8.0.1
        with:
          name: wasm-realtime-test-fixtures
          path: ${{ runner.temp }}/wasm-commandline-source/platform/wasm-wasi/test-artifacts
      - name: Download Preview 2 command from build job
        if: needs.csound-wasm.outputs.realtime-supported != '1'
        uses: actions/download-artifact@v8.0.1
        with:
          name: lib
          path: ${{ runner.temp }}/wasm-commandline-source/platform/wasm-wasi
      - name: Download matching command-line test sources
        uses: actions/download-artifact@v8.0.1
        with:
          name: wasm-commandline-test-sources
          path: ${{ runner.temp }}/wasm-commandline-source
      - uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: ${{ env.nix_path }}
      - name: Run command-line CSD tests with Wasmtime
        working-directory: ${{ runner.temp }}/wasm-commandline-source
        run: |
          if [ "${{ needs.csound-wasm.outputs.realtime-supported }}" = 1 ]; then
            threaded=true
          else
            threaded=false
            unzip platform/wasm-wasi/lib.zip -d platform/wasm-wasi
          fi
          nix-build ./platform/wasm-wasi/src/csound-tests.nix --arg threaded "$threaded" --no-out-link --show-trace --option log-lines 10000

  browser-test:
    permissions:
      contents: read
      checks: write
    env:
      wasm_bin_dir: ./platform/wasm-wasi
      wasm_browser_dir: ./platform/wasm-wasi/browser
      NIXPKGS_ALLOW_UNFREE: 1
    name: Browser bundle build and test
    needs: csound-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: ${{ env.nix_path }}
      - uses: cachix/cachix-action@v17
        with:
          name: csound
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - name: Download Artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: lib
      - name: Download private realtime fixtures
        if: needs.csound-wasm.outputs.realtime-supported == '1'
        uses: actions/download-artifact@v8.0.1
        with:
          name: wasm-realtime-test-fixtures
          path: ${{ env.wasm_bin_dir }}/test-artifacts
      - name: Uncompress freshly compiled wasm artifacts
        run: |
          nix-env -f '<nixpkgs>' -iA unzip
          unzip ./lib.zip -d $wasm_bin_dir
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: platform/wasm-wasi/browser/.nvmrc
      - name: Build the production js module bundle
        run: |
          nix-env -f '<nixpkgs>' -iA openjdk
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME"
          cd $wasm_browser_dir
          npm ci
          npm link --no-save --package-lock=false --ignore-scripts ..
          npm run test:closure
          if [ "${{ needs.csound-wasm.outputs.realtime-supported }}" = 1 ]; then
            npm run test:fixtures
          else
            npm run build:prod
          fi
          npm run build:tools
      - name: Install test dependencies
        run: |
          cd $wasm_browser_dir
          nix-shell --run 'exit 0'
      - name: Check eslint
        run: |
          cd $wasm_browser_dir
          nix-shell --pure --run 'npm run lint:ci'
      - name: Run the unit-tests with google-chrome
        run: |
          cd $wasm_browser_dir
          nix-shell --pure --run 'npm run test:ci'
      - name: Run realtime browser integration checks
        if: needs.csound-wasm.outputs.realtime-supported == '1'
        run: |
          cd $wasm_browser_dir
          nix-shell --pure --run 'npm run test:realtime'
      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6.5.0
        with:
          report_paths: "**/tests/*.junit.xml"
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          fail_on_failure: true
          require_tests: true
          include_passed: false
          detailed_summary: true
          token: ${{ github.token }}
          check_title_template: |-
            {{FILE_NAME}} | {{SUITE_NAME}} | {{TEST_NAME}}
