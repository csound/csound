name: Static and const correctness

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang-18
      CXX: clang++-18
      CLANG: clang-18
      CLANG_TIDY: clang-tidy-18
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Clang and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 python3-clang-18 \
            cmake ninja-build bison flex gettext libsndfile1-dev libsamplerate0-dev
      - name: Check the lint runner
        run: /usr/bin/python3 tests/test_static_const.py
      - name: Configure source analysis
        run: >
          cmake -S . -B build-lint -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=OFF
          -DBUILD_STATIC_LIBRARY=OFF
          -DBUILD_UTILITIES=ON
          -DBUILD_INSTALLER=OFF
          -DUSE_MP3=OFF
          -DUSE_CURL=OFF
      - name: Build and generate parser sources
        run: cmake --build build-lint --parallel 2
      - name: Check static and const declarations
        run: >
          /usr/bin/python3 scripts/check_static_const.py -p build-lint
          --clang clang-18 --clang-tidy clang-tidy-18 --jobs 2
